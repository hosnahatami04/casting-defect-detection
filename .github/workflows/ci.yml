name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Lint
        run: |
          uv run ruff check src tests benchmarks
          uv run ruff format --check src tests benchmarks
      - name: Test
        run: uv run pytest -m "not ml"

  ml-checks:
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: uv sync --extra dev --extra ml --extra deploy --extra serve --extra ui
      # mypy and the heavy tests need the full dependency set (model code, ONNX
      # runtime and the service/UI modules).
      - name: Type check
        run: uv run mypy
      - name: Heavy tests
        run: uv run pytest -m ml
