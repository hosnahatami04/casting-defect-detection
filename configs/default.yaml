seed: 42
image_size: 512

paths:
  data_raw: data/raw
  data_processed: data/processed
  artifacts: artifacts
  reports: reports

dataset:
  # Kaggle casting dataset archive, verified by castinspect acquire.
  archive_sha256: a11236976a65d77edd41fa3f8a2803a583157bd7401efc5e7ef5532cf3a00437
  # Files are grayscale content stored in RGB JPEG containers.
  allowed_modes: [RGB]

grouping:
  # Hamming distance at or below this value marks a near-duplicate pair.
  # Calibrated on the real distance distribution; see ADR 0003.
  dhash_threshold: 3

split:
  test_fraction: 0.2
  n_folds: 5

decision:
  # Share of defects that must be caught (rejected or sent to review).
  recall_target: 0.99
  # Highest tolerated share of defects passed automatically, on OOF.
  max_escape: 0.005
  # Relative costs: an escaped defect versus one wrongly rejected good part,
  # and the cost of one manual inspection.
  costs:
    escape: 20.0
    false_reject: 1.0
    manual_review: 0.5
